set -g history-limit 10000

set -g base-index 1
set -g mouse on
setw -g pane-base-index 1

set -s escape-time 0

bind-key d select-pane -L
bind-key n select-pane -R
bind-key t select-pane -U
bind-key h select-pane -D

bind-key '%' split-window -h -c '#{pane_current_path}'
bind-key '"' split-window -v -c '#{pane_current_path}'
# bind-key 'c' new-window \; split-window -h -p 38 \; split-window -v \;
bind-key 'x' setw synchronize-panes

bind-key Left  resize-pane -L
bind-key Right resize-pane -R
bind-key Up    resize-pane -U
bind-key Down  resize-pane -D
bind-key m     resize-pane -Z
set-option -g focus-events on
set-option -sa terminal-overrides ',xterm-256color:RGB'

